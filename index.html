<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Светлана - нейросети</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-from: #f5f0ff;
      --bg-to: #e6f4ff;
      --card: #ffffff;
      --text: #1f1b33;
      --muted: #6b6785;
      --accent: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Manrope", system-ui, sans-serif;
      line-height: 1.7;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-from), var(--bg-to));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      background: var(--card);
      max-width: 640px;
      width: 100%;
      padding: 40px 36px;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(124, 58, 237, 0.15);
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
    }
    .subtitle {
      color: var(--muted);
      margin: 4px 0 24px;
      font-weight: 600;
    }
    h2 {
      margin-top: 32px;
      font-size: 1.25rem;
    }
    ul { padding-left: 20px; }
    li::marker { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Привет, я Светлана</h1>
    <p class="subtitle">Изучаю нейросети</p>

    <p>Нейросети - это не только моя учёба, но и главное увлечение.</p>
    <p>Сейчас я осваиваю Claude Code и учусь делать с его помощью свои первые сайты.</p>

    <h2>Что я изучаю</h2>
    <ul>
      <li>Нейросети</li>
      <li>Claude Code</li>
      <li>Одностраничные сайты</li>
    </ul>
  </main>
</body>
</html>
